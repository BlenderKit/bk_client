name: Release (draft / testing only)

# Builds the cross-platform Client bundle (bk_client.zip) via dev.py for quick,
# UNSIGNED test builds. This workflow does NOT publish real releases.
#
# HOW TO USE:
#   Actions tab -> "Release (draft / testing only)" -> "Run workflow". This runs
#   on any branch and uploads bk_client.zip as a downloadable run artifact — no
#   tag needed. Set the "make_release" input to "draft" to also publish a DRAFT
#   GitHub Release (auto-named, safe to delete) so the release-publishing step
#   can be exercised too.
#
# REAL RELEASES: use the "build" workflow with make_release=publish. That
# pipeline code-signs the binaries and publishes a non-draft GitHub Release.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Also publish a DRAFT GitHub Release?"
        type: choice
        options:
          - "no"
          - "draft"
        default: "no"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read Client version
        id: ver
        run: echo "version=$(cat client/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform bundle
        run: python dev.py build

      - name: Locate bundle
        id: bundle
        run: echo "path=out/v${{ steps.ver.outputs.version }}/bk_client.zip" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      # Optional draft release when manually testing via workflow_dispatch.
      - name: Publish draft release (manual test)
        if: github.event_name == 'workflow_dispatch' && inputs.make_release == 'draft'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ci-test-${{ github.run_number }}
          name: CI test build ${{ steps.ver.outputs.version }} (run ${{ github.run_number }})
          draft: true
          files: ${{ steps.bundle.outputs.path }}
