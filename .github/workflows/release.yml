name: Release

# Builds the cross-platform Client bundle (bk_client.zip) via dev.py.
#
# HOW TO TEST THE CI WITHOUT A TAG:
#   Actions tab -> "Release" -> "Run workflow". This runs on any branch and
#   uploads bk_client.zip as a downloadable run artifact — no tag needed.
#   Set the "make_release" input to "draft" to also publish a DRAFT GitHub
#   Release (auto-named, safe to delete) so the release-publishing step can be
#   exercised too.
#
# REAL RELEASES: pushing a tag like v1.10.0 builds the bundle and publishes a
# non-draft GitHub Release with bk_client.zip attached.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Also publish a GitHub Release?"
        type: choice
        options:
          - "no"
          - "draft"
        default: "no"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read Client version
        id: ver
        run: echo "version=$(cat client/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform bundle
        run: python dev.py build

      - name: Locate bundle
        id: bundle
        run: echo "path=out/v${{ steps.ver.outputs.version }}/bk_client.zip" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bk_client
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      # Real release: triggered by pushing a v* tag.
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}

      # Optional draft release when manually testing via workflow_dispatch.
      - name: Publish draft release (manual test)
        if: github.event_name == 'workflow_dispatch' && inputs.make_release == 'draft'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-test-${{ github.run_number }}
          name: CI test build ${{ steps.ver.outputs.version }} (run ${{ github.run_number }})
          draft: true
          files: ${{ steps.bundle.outputs.path }}
