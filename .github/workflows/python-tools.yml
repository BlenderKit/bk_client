name: Python tools lint

# Lints the bundled Python recipes in client/tools (and dev.py) with ruff and
# pydoclint, using the configuration in pyproject.toml. Uses uv to run the dev
# tools without committing a lockfile or virtualenv.

on:
  push:
    paths:
      - "client/tools/**"
      - "dev.py"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"
  pull_request:
    paths:
      - "client/tools/**"
      - "dev.py"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: ruff check
        run: uvx ruff check client/tools dev.py

      - name: ruff format check
        run: uvx ruff format --check client/tools dev.py

      - name: pydoclint
        run: uvx pydoclint client/tools
