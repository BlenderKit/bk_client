name: Python tools lint

# Lints the bundled Python recipes in client/tools (and dev.py) with ruff and
# pydoclint, using the configuration in pyproject.toml. Uses uv to run the dev
# tools without committing a lockfile or virtualenv.

on:
  push:
    paths:
      - "client/tools/**"
      - "dev.py"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"
  pull_request:
    paths:
      - "client/tools/**"
      - "dev.py"
      - "pyproject.toml"
      - ".github/workflows/python-tools.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install \
            "ruff==0.15.20" \
            "pydoclint==0.9.1" \
            "bandit==1.9.4"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pydoclint check
        run: pydoclint .
      - name: Bandit (medium+)
        run: bandit -c _bandit.yaml -ll -r .
