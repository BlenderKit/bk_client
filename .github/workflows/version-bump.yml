name: PR version bump

# Automatically bumps the patch (debug) number in client/VERSION on every pull
# request so each merged PR ships a unique <major>.<minor>.<patch> version.
#
# The target is computed as the BASE branch's VERSION with the patch
# incremented by one (e.g. main=1.12.0 -> PR=1.12.1). Basing it on the base
# branch (not the PR's current VERSION) makes this idempotent: pushing more
# commits to the PR re-runs this job but always lands on the same number
# instead of inflating it on every push.
#
# Deliberate major/minor bumps are respected: if the PR already raises the
# major or minor above the base branch (e.g. 1.12.0 -> 1.13.0), the workflow
# leaves VERSION untouched instead of forcing a patch bump over it.
#
# openapi.json and API.md embed the version, so this workflow also regenerates
# them (go generate) and commits them with VERSION, keeping the api-docs drift
# check green.
#
# The bump commit is pushed with the default GITHUB_TOKEN, which by design does
# NOT re-trigger workflows, so there is no infinite loop. Fork PRs are skipped
# because the token cannot push to a fork's branch.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    # Skip PRs from forks: GITHUB_TOKEN has no write access to their branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Bump patch version and refresh API docs
        run: |
          set -euo pipefail

          # Cycle guard: if the PR head is already a bump commit, stop. The bump
          # push uses GITHUB_TOKEN (which does not re-trigger workflows), so this
          # is belt-and-suspenders in case the repo ever switches to a PAT.
          head_msg=$(git log -1 --pretty=%s)
          case "$head_msg" in
            "ci: bump version to "*)
              echo "Head commit is a version bump; skipping to avoid a cycle."
              exit 0
              ;;
          esac

          git fetch origin "${{ github.base_ref }}" --depth=1

          base_ver=$(git show "origin/${{ github.base_ref }}:client/VERSION" | tr -d '[:space:]')
          cur_ver=$(tr -d '[:space:]' < client/VERSION)
          echo "Base (${{ github.base_ref }}) VERSION: $base_ver"
          echo "PR   VERSION: $cur_ver"

          IFS='.' read -r bM bm bp <<< "$base_ver"
          IFS='.' read -r cM cm cp <<< "$cur_ver"
          for part in "$bM" "$bm" "$bp" "$cM" "$cm" "$cp"; do
            case "$part" in
              ''|*[!0-9]*)
                echo "::error::VERSION must be numeric <major>.<minor>.<patch>; got base='$base_ver' pr='$cur_ver'."
                exit 1
                ;;
            esac
          done

          # Respect a deliberate major/minor bump: if the PR already raised the
          # major or minor above the base branch, keep the author's number.
          # Otherwise force the patch to base + 1.
          if [ "$cM" -gt "$bM" ] || { [ "$cM" -eq "$bM" ] && [ "$cm" -gt "$bm" ]; }; then
            echo "PR raised major/minor above base ($base_ver -> $cur_ver); keeping it as-is."
          else
            next="${bM}.${bm}.$((bp + 1))"
            if [ "$cur_ver" = "$next" ]; then
              echo "client/VERSION already $next."
            else
              printf '%s\n' "$next" > client/VERSION
              echo "Set client/VERSION to $next."
            fi
          fi

          # openapi.json / API.md embed the version, so regenerate them to match
          # VERSION. Without this the api-docs drift check fails on the bump.
          ( cd client && go generate ./... )

          if [ -z "$(git status --porcelain)" ]; then
            echo "VERSION and docs already up to date; nothing to commit."
            exit 0
          fi

          final_ver=$(tr -d '[:space:]' < client/VERSION)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/VERSION client/docs
          git commit -m "ci: bump version to $final_ver"
          git push origin "HEAD:${{ github.head_ref }}"
