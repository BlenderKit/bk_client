name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a signed GitHub Release from this build?"
        type: choice
        options:
          - "no"
          - "publish"
        default: "no"
      blender_tests_branch:
        description: "Use Blender add-on tests from branch? Change this to test changes in github.com/blenderkit/blenderkit test suite, otherwise just keep main."
        type: string
        default: "main"

concurrency: # cancel all previous still running jobs on this PR or commit 
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getversion.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION file
        id: getversion
        working-directory: ./client
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Echo version
        run: echo ${{ steps.getversion.outputs.version }}

# MARK: BUILDS
  build_linux_arm:
    runs-on: ubuntu-24.04-arm
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        run: CGO_ENABLED=0 go build -o out/bk_client-linux-arm64 -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-linux-arm64
          path: client/out/bk_client-linux-arm64
          archive: false

  build_linux_x86_64:
    runs-on: ubuntu-24.04
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        run: CGO_ENABLED=0 go build -o out/bk_client-linux-x86_64 -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-linux-x86_64
          path: client/out/bk_client-linux-x86_64
          archive: false

  build_macos_arm:
    runs-on: macos-26
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        run: CGO_ENABLED=0 go build -o out/bk_client-macos-arm64 -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-macos-arm64
          path: client/out/bk_client-macos-arm64
          archive: false

  build_macos_x86_64:
    runs-on: macos-26-intel
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        run: CGO_ENABLED=0 go build -o out/bk_client-macos-x86_64 -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-macos-x86_64
          path: client/out/bk_client-macos-x86_64
          archive: false

  build_windows_arm:
    runs-on: windows-11-arm
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        env:
          CGO_ENABLED: '1'
        run: go build -o out/bk_client-windows-arm64.exe -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows-arm64.exe
          path: client/out/bk_client-windows-arm64.exe
          archive: false

  build_windows_x86_64:
    runs-on: windows-latest
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: './client/go.mod'
          cache-dependency-path: './client/go.sum'
        id: go
      - name: Check Go env
        working-directory: ./client
        run: go env
      - name: Build Blendkit_Client
        working-directory: ./client
        env:
          CGO_ENABLED: '1'
        run: go build -o out/bk_client-windows-x86_64.exe -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows-x86_64.exe
          path: client/out/bk_client-windows-x86_64.exe
          archive: false

  # Windows 7/8/8.1 (pre-Windows-10) build. Go >= 1.21 dropped support for these
  # OSes, so we cross-compile with the last compatible toolchain (go1.20) and a
  # pinned set of older dependencies. Produces a separate, distinctly named
  # binary shipped alongside the modern one; the add-on picks it automatically on
  # pre-Windows-10 machines.
  build_windows7_x86_64:
    runs-on: ubuntu-24.04
    needs: get_version
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.20 (last version supporting Windows 7/8)
        uses: actions/setup-go@v6
        with:
          go-version: '1.20.14'
        id: go
      - name: Pin module + dependencies for Go 1.20
        # color@v1.6.x needs sys@v0.38.0 (go1.24+); go-get-proxied@v1.4.0 needs
        # go1.25+. Downgrade to the last versions that build on go1.20.
        working-directory: ./client
        run: |
          go mod edit -go=1.20
          go get github.com/rapid7/go-get-proxied@1.3.2
          go get github.com/gookit/color@v1.5.4
          go get golang.org/x/sys@v0.30.0
          go mod tidy
      - name: Build Blendkit_Client (Windows 7 x86_64)
        working-directory: ./client
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -o out/bk_client-windows7-x86_64.exe -ldflags "-X main.ClientVersion=${{ needs.get_version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows7-x86_64.exe
          path: client/out/bk_client-windows7-x86_64.exe
          archive: false

# MARK: CODE SIGN
  code_sign_macos:
    runs-on: ubuntu-latest
    environment: signing
    needs: [build_macos_arm, build_macos_x86_64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out/
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R out/

      ### MACOS CODE SIGN

      - name: Materialize p12 certificate
        env:
          APPLE_DEV_CERTIFICATE: ${{ secrets.APPLE_DEV_CERTIFICATE }}
        run: echo $APPLE_DEV_CERTIFICATE | base64 --decode > cert.p12

      - name: MacOS Sign - ARM64
        uses: indygreg/apple-code-sign-action@v1
        env:
          APPLE_DEV_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
        with:
          input_path: out/bk_client-macos-arm64
          sign: true
          sign_args: |
            --code-signature-flags
            runtime
          notarize: false
          staple: false
          p12_file: cert.p12
          p12_password: ${{ env.APPLE_DEV_CERTIFICATE_PASSWORD }}

      - name: MacOS Sign - x86_64
        uses: indygreg/apple-code-sign-action@v1
        env:
          APPLE_DEV_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
        with:
          input_path: out/bk_client-macos-x86_64
          sign: true
          sign_args: |
            --code-signature-flags
            runtime
          notarize: false
          staple: false
          p12_file: cert.p12
          p12_password: ${{ env.APPLE_DEV_CERTIFICATE_PASSWORD }}

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API__AUTH_KEY: ${{ secrets.APP_STORE_CONNECT_API__AUTH_KEY }}
        run: |
          mkdir -p private_keys/
          echo $APP_STORE_CONNECT_API__AUTH_KEY > private_keys/AuthKey_Y69M4JF3A4.p8

      ### MACOS NOTARIZATION

      - name: Zip binary macOS arm64
        run: zip -j out/bk_client-macos-arm64.zip out/bk_client-macos-arm64

      - name: Zip binary macOS x86_64
        run: zip -j out/bk_client-macos-x86_64.zip out/bk_client-macos-x86_64

      - name: Create JSON-encoded API key
        env:
          KEY_JSON_FILE: ${{ secrets.APP_STORE_CONNECT_API__KEY_JSON_FILE }}
        run: |
          printf '%s' "$KEY_JSON_FILE" > appstoreconnect_key.json

      - name: MacOS Notarize - ARM64
        uses: indygreg/apple-code-sign-action@v1
        env:
          APP_STORE_CONNECT_API__ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API__ISSUER_ID }}
        with:
          input_path: out/bk_client-macos-arm64.zip
          sign: false
          notarize: true
          staple: false
          app_store_connect_api_key_json_file: appstoreconnect_key.json

      - name: MacOS Notarize - x86_64
        uses: indygreg/apple-code-sign-action@v1
        env:
          APP_STORE_CONNECT_API__ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API__ISSUER_ID }}
        with:
          input_path: out/bk_client-macos-x86_64.zip
          sign: false
          notarize: true
          staple: false
          app_store_connect_api_key_json_file: appstoreconnect_key.json

      - name: Upload signed ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client-macos-arm64
          path: out/bk_client-macos-arm64
          overwrite: true
          archive: false

      - name: Upload signed x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client-macos-x86_64
          path: out/bk_client-macos-x86_64
          overwrite: true
          archive: false

  code_sign_windows:
    runs-on: ubuntu-latest
    environment: signing
    needs: [build_windows_arm, build_windows_x86_64, build_windows7_x86_64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out/
          merge-multiple: true

      - name: Code sign Windows binaries
        uses: agajdosi/certum-code-sign-action@main
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP:   ${{ secrets.CERTUM_OTP }}
        with:
          input_path: out/bk_client-windows*.exe

      - name: Upload signed x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows-x86_64.exe
          path: out/bk_client-windows-x86_64.exe
          archive: false
          overwrite: true

      - name: Upload signed ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows-arm64.exe
          path: out/bk_client-windows-arm64.exe
          archive: false
          overwrite: true

      - name: Upload signed Windows 7 x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bk_client-windows7-x86_64.exe
          path: out/bk_client-windows7-x86_64.exe
          archive: false
          overwrite: true

  build_zip:
    runs-on: macos-26
    needs: [code_sign_macos, code_sign_windows, get_version, build_linux_x86_64, build_linux_arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: binaries/
          merge-multiple: true
      - run: ls -a binaries/

      - name: Install osslsigncode
        run: brew install osslsigncode

      - run: chmod 755 binaries/bk_client-macos-arm64
      - run: chmod 755 binaries/bk_client-macos-x86_64
      - run: chmod 755 binaries/bk_client-linux-arm64
      - run: chmod 755 binaries/bk_client-linux-x86_64

      - name: Build the release
        run: python dev.py release --prebuilt-bin-dir ./binaries

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: bk_client.zip
          path: out/v${{ needs.get_version.outputs.version }}/bk_client.zip
          archive: false

  release:
    # Real release: run this workflow manually with make_release=publish.
    # The tag v<version> (from client/VERSION) is created automatically at the
    # triggering commit, so no manual tagging is needed.
    runs-on: ubuntu-latest
    needs: [build_zip, get_version]
    if: github.event_name == 'workflow_dispatch' && inputs.make_release == 'publish'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bk_client.zip
          path: release
      - name: Repackage release ZIP
        # The artifact is uploaded with archive:false, so download-artifact
        # extracts the zip envelope and we get its loose contents back. Re-zip
        # them (restoring exec bits stripped during extraction) to recreate the
        # bk_client.zip asset for the release.
        run: |
          echo "Downloaded files:"
          ls -R release
          chmod 755 release/bk_client-linux-* release/bk_client-macos-* 2>/dev/null || true
          ( cd release && zip -r -X ../bk_client.zip . )
          echo "Repackaged bk_client.zip:"
          unzip -l bk_client.zip
      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: bk_client v${{ needs.get_version.outputs.version }}
          draft: false
          fail_on_unmatched_files: true
          files: bk_client.zip

# MARK: TESTS
  make_blenderkit_tests_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: blenderkit/blenderkit
          ref: ${{ inputs.blender_tests_branch }}
      - id: set-matrix
        run: python .github/make-tests-matrix.py >> $GITHUB_OUTPUT

  blenderkit_TESTS_ubuntu_x86_64:
    needs: [make_blenderkit_tests_matrix, build_linux_x86_64, get_version]
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.make_blenderkit_tests_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: blenderkit/blenderkit
          ref: ${{ inputs.blender_tests_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: bk_client-linux-x86_64
          path: prebuilt

      - run: echo $VERSION > prebuilt/VERSION
        env:
          VERSION: ${{ needs.get_version.outputs.version }}
      - run: ls prebuilt
      - run: cat prebuilt/VERSION

      - run: echo $GIT_DISCOVERY_ACROSS_FILESYSTEM
      - run: pwd
      - name: Checkout bk_proxor submodule
        run: git submodule update --init bk_proxor

      - name: Make prebuilt client executable
        run: chmod +x prebuilt/bk_client-linux-x86_64

      - name: Single binary build
        run: python dev.py build --client-build prebuilt

      - name: Cache Blender
        id: blenderBinaryCache
        uses: actions/cache@v6
        with:
          path: $HOME/blender
          key: blender-${{matrix.version}}-${{matrix.sha}}
      - name: Check Blender binary exists
        id: blenderBinaryCheck
        run: test -f $HOME/blender/blender || echo "BLENDER_BINARY_MISSING=true" >> $GITHUB_OUTPUT
      - name: Download Blender
        if: steps.blenderBinaryCheck.outputs.BLENDER_BINARY_MISSING == 'true'
        run: curl -fL ${{ matrix.download_url }} -o $HOME/blender.tar.xz
      - name: Mkdir
        run: mkdir {$HOME/.local/bin,$HOME/blender} -p
      - name: Extract Blender
        if: steps.blenderBinaryCheck.outputs.BLENDER_BINARY_MISSING == 'true'
        run: tar -xf $HOME/blender.tar.xz -C $HOME/blender --strip-components=1
      - name: Add Blender to PATH
        run: ln -s $HOME/blender/blender $HOME/.local/bin/blender
      - name: TEST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dev.py test --client-build prebuilt --install-at $HOME/.config/blender/${{matrix.version_x_y}}/scripts/addons 


  blenderkit_TESTS_debian_x86_64:
    needs: [make_blenderkit_tests_matrix, build_linux_x86_64, get_version]
    continue-on-error: true
    runs-on: ubuntu-latest
    container: debian:latest
    strategy:
      matrix: ${{ fromJSON(needs.make_blenderkit_tests_matrix.outputs.matrix) }}
    steps:
      - run: apt update
      - run: apt install -y python3 curl xz-utils git libxrender1 libxxf86vm1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
      - run: git config --global --add safe.directory $PWD

      - uses: actions/checkout@v7
        with:
          repository: blenderkit/blenderkit
          ref: ${{ inputs.blender_tests_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: bk_client-linux-x86_64
          path: prebuilt

      - run: echo $VERSION > prebuilt/VERSION
        env:
          VERSION: ${{ needs.get_version.outputs.version }}
      - run: ls prebuilt
      - run: cat prebuilt/VERSION

      - name: Checkout bk_proxor submodule
        run: git submodule update --init bk_proxor

      - name: Make prebuilt client executable
        run: chmod +x prebuilt/bk_client-linux-x86_64

      - name: Single binary build
        run: python3 dev.py build --client-build prebuilt

      - name: Cache Blender
        id: blenderBinaryCache
        uses: actions/cache@v6
        with:
          path: $HOME/blender
          key: blender-${{matrix.version}}-${{matrix.sha}}
      - name: Mkdir
        run: mkdir $HOME/blender -p
      - name: Check Blender binary exists
        id: blenderBinaryCheck
        run: test -f $HOME/blender/blender || echo "BLENDER_BINARY_MISSING=true" >> $GITHUB_OUTPUT
      - name: Download Blender
        if: steps.blenderBinaryCheck.outputs.BLENDER_BINARY_MISSING == 'true'
        run: curl -fL ${{ matrix.download_url }} -o $HOME/blender.tar.xz
      - name: Extract Blender
        if: steps.blenderBinaryCheck.outputs.BLENDER_BINARY_MISSING == 'true'
        run: tar -xf $HOME/blender.tar.xz -C $HOME/blender --strip-components=1

      - run: echo $PATH
      - name: Add Blender to PATH
        run: ln -s $HOME/blender/blender /usr/local/bin/blender

      - name: TEST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 dev.py test --client-build prebuilt --install-at $HOME/.config/blender/${{matrix.version_x_y}}/scripts/addons

  blenderkit_TESTS_fedora_x86_64:
    needs: [make_blenderkit_tests_matrix, build_linux_x86_64, get_version]
    continue-on-error: true
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      matrix: ${{ fromJSON(needs.make_blenderkit_tests_matrix.outputs.matrix) }}
    steps:
      - run: dnf install -y git libXrender libXxf86vm libXi libXfixes mesa-libGL libxkbcommon libSM
      - run: git config --global --add safe.directory $PWD
      - uses: actions/checkout@v7
        with:
          repository: blenderkit/blenderkit
          ref: ${{ inputs.blender_tests_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: bk_client-linux-x86_64
          path: prebuilt

      - run: echo $VERSION > prebuilt/VERSION
        env:
          VERSION: ${{ needs.get_version.outputs.version }}
      - run: ls prebuilt
      - run: cat prebuilt/VERSION

      - name: Checkout bk_proxor submodule
        run: git submodule update --init bk_proxor

      - name: Make prebuilt client executable
        run: chmod +x prebuilt/bk_client-linux-x86_64

      - name: Single binary build
        run: python dev.py build --client-build prebuilt

      - name: Cache Blender
        id: blenderBinaryCache
        uses: actions/cache@v6
        with:
          path: $HOME/blender
          key: blender-${{matrix.version}}-${{matrix.sha}}
      - name: Mkdir
        run: mkdir $HOME/blender -p
      - name: Check Blender binary exists
        id: blenderBinaryCheck
        run: test -f $HOME/blender/blender || echo "BLENDER_BINARY_MISSING=true" >> $GITHUB_OUTPUT
      - name: Download Blender
        if: steps.blenderBinaryCache.outputs.cache-hit != 'true'
        run: curl -fL ${{ matrix.download_url }} -o $HOME/blender.tar.xz
      - name: Extract Blender
        if: steps.blenderBinaryCache.outputs.cache-hit != 'true'
        run: tar -xf $HOME/blender.tar.xz -C $HOME/blender --strip-components=1

      - run: echo $PATH
      - name: Add Blender to PATH
        run: ln -s $HOME/blender/blender /usr/local/bin/blender

      - name: TEST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dev.py test --client-build prebuilt --install-at $HOME/.config/blender/${{matrix.version_x_y}}/scripts/addons 
