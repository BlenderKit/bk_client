name: API docs & client tests

# Regenerates the Client API documentation from the Go route registry and fails
# if the committed docs are stale, then runs the Go test suite (which includes
# the drift test guaranteeing the registry matches the real routes).

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/api-docs.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

jobs:
  api-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Regenerate API documentation
        run: go generate ./...

      - name: Fail if generated docs are out of date
        run: |
          if ! git diff --exit-code -- docs; then
            echo "::error::docs/openapi.json or docs/API.md are out of date."
            echo "Run 'go generate ./...' in the client directory and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./tests/...
