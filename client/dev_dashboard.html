<!DOCTYPE html>
<!--
  Blendkit-Client developer dashboard.

  Served by the Client itself at /dev so every request below is SAME-ORIGIN:
  this avoids CORS entirely, so the settings endpoints (which do not send CORS
  headers) work straight from the browser. Intended for manual testing only.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blendkit-Client — Dev Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; padding: 1.5rem; line-height: 1.4;
    max-width: 1100px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .sub { opacity: .7; margin: 0 0 1.25rem; font-size: .9rem; }
  .card {
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
    padding: 1rem; margin-bottom: 1rem;
  }
  .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .method {
    font-weight: 700; font-size: .75rem; padding: .15rem .5rem; border-radius: 4px;
    color: #fff; min-width: 46px; text-align: center;
  }
  .GET { background: #2d7d46; }
  .POST { background: #b8860b; }
  .path { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .desc { opacity: .75; font-size: .85rem; margin: .35rem 0 .5rem; }
  textarea {
    width: 100%; min-height: 6.5rem; font-family: ui-monospace, Consolas, monospace;
    font-size: .85rem; padding: .5rem; border-radius: 6px;
    border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit;
  }
  button {
    cursor: pointer; border: 0; border-radius: 6px; padding: .45rem .9rem;
    font-weight: 600; background: #3b82f6; color: #fff;
  }
  button:hover { background: #2563eb; }
  button.ghost { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.5); }
  pre.result {
    margin: .6rem 0 0; padding: .6rem; border-radius: 6px; overflow: auto;
    background: rgba(128,128,128,.12); font-size: .82rem; white-space: pre-wrap;
    max-height: 20rem;
  }
  .status-ok { color: #2d7d46; font-weight: 700; }
  .status-err { color: #dc2626; font-weight: 700; }
  .muted { opacity: .55; }
  .toolbar { margin-bottom: 1rem; display: flex; gap: .6rem; align-items: center; }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
  <h1>Blendkit-Client — Dev Dashboard</h1>
  <p class="sub">
    Base: <code id="base"></code> · Same-origin, so no CORS. For manual testing only.
  </p>

  <div class="toolbar">
    <button id="runAll">Run all read-only (GET) requests</button>
    <span class="muted">Runs <code>/</code>, <code>/debug</code>, <code>/settings/get</code>, <code>/addons/list</code>, <code>/tools/list</code>, <code>/executable/list</code></span>
  </div>

  <div id="cards"></div>

<script>
const BASE = location.origin;
document.getElementById("base").textContent = BASE;

// Each request definition. body = default JSON body for POST (editable).
const REQUESTS = [
  { id: "index", method: "GET", path: "/", readonly: true,
    desc: "Client status page (HTML)." },
  { id: "debug", method: "GET", path: "/debug", readonly: true,
    desc: "Network / proxy diagnostics. (slow, tests all permutations)" },
  { id: "settings_get", method: "GET", path: "/settings/get", readonly: true,
    desc: "Current settings snapshot — the source of truth all plugins sync to." },
  { id: "settings_set", method: "POST", path: "/settings/set",
    desc: "Change shared settings (only fields present are modified); broadcast to all plugins.",
    body: { server: "https://staging.blendkit.com" } },
  { id: "set_var_global", method: "POST", path: "/settings/set_variable",
    desc: "Store a GLOBAL variable (no plugin association).",
    body: { variable: "value", value: "1" } },
  { id: "set_var_plugin", method: "POST", path: "/settings/set_variable",
    desc: "Store a PLUGIN-scoped variable (blender -> executable).",
    body: { plugin: "blender", variable: "executable", value: "C:/Program Files/Blender/blender.exe" } },
  { id: "executable_list", method: "GET", path: "/executable/list", readonly: true,
    desc: "List executables the Client stores for plugins (e.g. a registered Blender). Also synced on every /report." },
  { id: "executable_get", method: "GET", path: "/executable/get?name=blender", readonly: true,
    desc: "Get stored executables for a name (add &version=4.2.2 to filter). Returns {name, executables:[...]} highest-version-first." },
  { id: "executable_set", method: "POST", path: "/executable/set",
    desc: "Register/replace a versioned executable other plugins can reuse (fallback for /tools/run & /run_blender_script). Multiple versions can share a name.",
    body: { name: "blender", path: "C:/Program Files/Blender Foundation/Blender 4.2/blender.exe", version: "4.2.2", args: [] } },
  { id: "report", method: "POST", path: "/report",
    desc: "Simulate a plugin poll: subscribes the app and returns its tasks (incl. the broadcast 'settings' task).",
    body: { app_id: 12345, api_key: "", addon_version: "3.13.0", blender_version: "4.2.2", platform_version: "dev-dashboard", project_name: "dev-dashboard" } },
  { id: "list_addons", method: "GET", path: "/addons/list", readonly: true,
    desc: "List subscribed softwares/plugins (host-agnostic, not CORS-gated)." },
  { id: "tools_list", method: "GET", path: "/tools/list", readonly: true,
    desc: "List the recipes bundled inside this Client binary (host-agnostic). Each entry carries its parameter schema for /tools/run." },
  { id: "tools_run", method: "POST", path: "/tools/run",
    desc: "Run a bundled recipe (script_id from /tools/list) under headless Blender; params are forwarded as params.json. Canonical alias for /run_blender_script. Needs a real blender_exe_path to actually run.",
    body: { app_id: 12345, blender_exe_path: "C:/Program Files/Blender Foundation/Blender 4.2/blender.exe", script_id: "export_glb", output_path: "C:/temp/dev-dashboard-export.glb", params: { output_path: "C:/temp/dev-dashboard-export.glb", yup: true } } },
  { id: "status", method: "GET", path: "/bkclientjs/status", readonly: false,
    desc: "Browser status endpoint (CORS-gated: needs an allowed Origin, so same-origin GET here returns 403)." },
  { id: "unsubscribe", method: "POST", path: "/addons/unsubscribe",
    desc: "Unsubscribe the simulated add-on.",
    body: { app_id: 12345 } },
  { id: "shutdown", method: "POST", path: "/shutdown",
    desc: "Shut the Client down." },
];

function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  for (const c of children) e.append(c);
  return e;
}

function buildCard(req) {
  const card = el("div", { className: "card" });
  const head = el("div", { className: "row" },
    el("span", { className: "method " + req.method, textContent: req.method }),
    el("span", { className: "path", textContent: req.path }),
  );
  card.append(head, el("div", { className: "desc", textContent: req.desc }));

  let bodyArea = null;
  if (req.method === "POST" && req.body) {
    bodyArea = el("textarea", { value: JSON.stringify(req.body, null, 2) });
    card.append(bodyArea);
  }

  const result = el("pre", { className: "result muted", textContent: "(not sent yet)" });
  const sendBtn = el("button", { textContent: "Send" });
  sendBtn.addEventListener("click", () => send(req, bodyArea, result));

  card.append(el("div", { className: "row", style: "margin-top:.6rem" }, sendBtn), result);
  return { card, req, bodyArea, result };
}

async function send(req, bodyArea, result) {
  result.className = "result muted";
  result.textContent = "sending…";
  const opts = { method: req.method };
  if (req.method === "POST" && bodyArea) {
    opts.headers = { "Content-Type": "application/json" };
    try {
      // Re-stringify to validate and normalize the edited JSON.
      opts.body = JSON.stringify(JSON.parse(bodyArea.value));
    } catch (e) {
      result.className = "result";
      result.innerHTML = '<span class="status-err">Invalid JSON in body: ' + e.message + "</span>";
      return;
    }
  }
  const started = performance.now();
  try {
    const resp = await fetch(BASE + req.path, opts);
    const ms = (performance.now() - started).toFixed(0);
    const text = await resp.text();
    let pretty = text;
    const ct = resp.headers.get("content-type") || "";
    if (ct.includes("application/json") && text) {
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    }
    const cls = resp.ok ? "status-ok" : "status-err";
    result.className = "result";
    result.innerHTML =
      '<span class="' + cls + '">' + req.method + " " + req.path + " → " +
      resp.status + " " + resp.statusText + "</span> " +
      '<span class="muted">(' + ms + " ms)</span>\n\n" +
      escapeHtml(pretty || "(empty body)");
  } catch (e) {
    result.className = "result";
    result.innerHTML = '<span class="status-err">Network error: ' + escapeHtml(e.message) +
      "</span>\n\n(Is the Client running and reachable at " + BASE + "?)";
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

const cardObjs = REQUESTS.map(buildCard);
const container = document.getElementById("cards");
for (const o of cardObjs) container.append(o.card);

document.getElementById("runAll").addEventListener("click", async () => {
  for (const o of cardObjs) {
    if (o.req.readonly) {
      await send(o.req, o.bodyArea, o.result);
    }
  }
});
</script>
</body>
</html>
